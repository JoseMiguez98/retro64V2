name: CI

# The verification gate from AGENTS.md §1.4, enforced by the forge rather than
# by the agent that wrote the code. An agent can claim its checks passed; this
# re-runs them on a clean machine where nobody can skip a step.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run obsolete — don't burn minutes on it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fast, static feedback: lint + typecheck + build. Split from e2e so a syntax
  # error fails in ~1 min instead of waiting behind a browser suite.
  static:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        # pnpm version comes from the `packageManager` field in package.json,
        # so it can never drift from what developers run locally.
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

  # The real verification: boots the actual signaling server and web dev server
  # and drives them with a real browser (packages/e2e).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        # `--with-deps` pulls the system libraries headless Chromium needs on a
        # bare ubuntu runner; the repo's own script only fetches the browser.
        run: pnpm --filter @retro64/e2e exec playwright install --with-deps chromium

      - run: pnpm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
